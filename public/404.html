<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaurav Kumar Verma | Software Engineer</title>
    <!--
      GitHub Pages SPA redirect:
      When GitHub Pages serves a 404 for a deep URL, this page redirects
      back to index.html preserving the path as a query parameter, which
      the app can then decode. For a single-page portfolio (no client-side
      router), a direct redirect to the root is sufficient.
    -->
    <script>
      // Redirect any 404 back to the root so the React app handles routing.
      // The sessionStorage trick is not needed for a routerless SPA —
      // a simple redirect is enough and avoids a flash of wrong content.
      sessionStorage.setItem('redirect', location.href);
      location.replace('/');
    </script>
  </head>
  <body></body>
</html>
